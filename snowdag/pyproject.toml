[project]
name = "snowdag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8,<3.13"
dependencies = [
    "dagster",
    "dagster-aws>=0.24.13",
    "dagster-cloud",
    "pandas>=2.0.3",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary]>=3.2.6",
    "zeep>=4.3.1",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver", 
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "snowdag.definitions"
code_location_name = "snowdag"
